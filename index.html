<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Calcultor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="app">
    <header class="calculator-head">
      <select class="navBar">
        <option>Basic</li>
        <option>Age</option>
        <option>EMI</option>
        <option>GramPrice </option>
      </select>
      <div class="head-toolbar">
        <div class="icon-div js-fa-calculator">
          <i class="fa-solid fa-calculator" title="History"></i>
        </div>
        <div class="right-side-tools">
          <div class="icon-div">
            <i class="fa-solid fa-moon de-active" title="dark mode"></i>
            <i class="fa-solid fa-sun" title="lignt mode"></i>
          </div>
          <div class="icon-div js-fa-square-root-variable">
            <i class="fa-solid fa-square-root-variable" title="Advance"></i>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="container">
        <div id="Basic" class="calculator active">
          <input type="text" id="input-box" placeholder="0">
          <div class="keyBoard">
            <div class="sci-keyboard appear">
              <button class="nor-btn">Rad</button>
              <button class="nor-btn">√</button>
              <button class="nor-btn">|x|</button>
              <button class="nor-btn">x!</button>
              <button class="nor-btn">sin</button>
              <button class="nor-btn">cos</button>
              <button class="nor-btn">tan</button>
              <button class="nor-btn">π</button>
              <button class="nor-btn">ln</button>
              <button class="nor-btn">log</button>
              <button class="nor-btn">1/x</button>
              <button class="nor-btn">e</button>
              <button class="nor-btn">e <sup>x</sup></button>
              <button class="nor-btn">x <sup>2</sup></button>
              <button class="nor-btn">y <sup>y</sup></button>
              <button class="nor-btn">+/-</button>
            </div>
            <div class="basic-keyboard">
              <button class="nor-btn clear-btn special">C</button>
              <button class="nor-btn delete-btn special">D</button>
              <button class="nor-btn special thisis">()</button>
              <button class="nor-btn special">*</button>
              <button class="nor-btn">9</button>
              <button class="nor-btn">8</button>
              <button class="nor-btn">7</button>
              <button class="nor-btn special">/</button>
              <button class="nor-btn">6</button>
              <button class="nor-btn">5</button>
              <button class="nor-btn">4</button>
              <button class="nor-btn special">-</button>
              <button class="nor-btn">3</button>
              <button class="nor-btn">2</button>
              <button class="nor-btn">1</button>
              <button class="nor-btn special">+</button>
              <button class="nor-btn">.</button>
              <button class="nor-btn">00</button>
              <button class="nor-btn">0</button>
              <button class="nor-btn equal-btn special">=</button>
            </div>
          </div>
          <div class="cal-history-panel">
            <div class="history-data"></div>
            <button class="history-clear-btn">Clear History</button>
          </div>
        </div>
        <div id="Age" class="calculator">
          <div class="result-container age-result"></div>
          <div class="section">
            <label for="input-date">Enter Date Of Birth:</label>
            <input type="date" id="input-date">
          </div>
          <button class="calculate">Calculate</button>
        </div>
        <div id="EMI" class="calculator">
          <div class="section">
            <label for="amount">Loan Amount:</label>
            <input type="number" id="amount" placeholder="Enter Loan Amount">
          </div>
          <div class="section">
            <label for="interest">Loan Interset:</label>
            <input type="number" id="interest" placeholder="Enter Loan Interset">
          </div>
          <div class="section">
            <label for="time">Loan Time:</label>
            <input type="number" id="time" placeholder="Enter Loan Time In Months">
          </div>
          <button class="calculate">Calculate</button>
          <div class="result-container emi-result"></div>
        </div>
        <div id="GramPrice" class="calculator">
          <div class="section">
            <label for="weight">Product Weight:</label>
            <input type="number" id="weight" placeholder="Enter Product Weight In KG">
          </div>
          <div class="section">
            <label for="price">Product Price:</label>
            <input type="number" id="price" placeholder="Enter Product Price">
          </div>
          <div class="section">
            <label for="youNeed">Product Weight You Need:</label>
            <input type="number" id="youNeed" placeholder="Enter Product Weight In Grams">
          </div>
          <button class="calculate">Calculate</button>
          <div class="result-container GramPrice-result"></div>
        </div>
      </div>
    </main>
  </section>

  <script src="script.js"></script>
</body>
</html>
